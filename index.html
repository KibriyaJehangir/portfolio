<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kibriya Portfolio — Loading</title>
<style>

  :root{
    --blue-deep:   #0056b3;
    --blue-mid:    #007BFF;
    --blue-bright: #00c6ff;
    --keyword:     #c586c0;
    --brace:       #ffd700;
    --cursor:      #00ff88;
    --ink:         #1c2b3a;
    --ink-soft:    #5b6b7a;
    --panel:       #ffffff;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
  }

  body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(to bottom, #e0f7fa, #ffffff);
    overflow: hidden;
    position: relative;
    color: var(--ink);
  }

  /* ---------- ambient grid, matches "code editor" world ---------- */
  .grid-bg{
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,123,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,123,255,0.05) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(circle at 50% 40%, rgba(0,0,0,0.65) 0%, transparent 72%);
    -webkit-mask-image: radial-gradient(circle at 50% 40%, rgba(0,0,0,0.65) 0%, transparent 72%);
    animation: gridDrift 18s linear infinite;
    z-index: 0;
  }

  @keyframes gridDrift{
    0%   { background-position: 0 0, 0 0; }
    100% { background-position: 42px 42px, 42px 42px; }
  }

  /* floating code-glyph particles */
  .particle{
    position: fixed;
    font-family: Consolas, "Courier New", monospace;
    color: rgba(0,123,255,0.18);
    font-size: 1.4rem;
    font-weight: 700;
    user-select: none;
    z-index: 0;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp{
    0%   { transform: translateY(0) rotate(0deg);   opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }

  /* ---------- cursor glow, identical concept to main site ---------- */
  .glow-circle{
    position: fixed;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(135, 176, 219, 0.15);
    pointer-events: none;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 15px rgba(0,123,255,0.4);
    transition: transform 0.1s ease-out, opacity 0.3s ease;
    z-index: 9999;
  }

  /* ================= console panel ================= */
  .console{
    position: relative;
    z-index: 2;
    width: min(480px, 88vw);
    background: var(--panel);
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,86,179,0.18), 0 2px 8px rgba(0,0,0,0.06);
    overflow: hidden;
    opacity: 0;
    transform: translateY(18px) scale(0.97);
    animation: panelIn 0.7s cubic-bezier(.19,1,.22,1) forwards;
  }

  @keyframes panelIn{
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }

  .console-titlebar{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #f5f9ff;
    border-bottom: 1px solid #e6effa;
  }

  .dot{
    width: 11px; height: 11px;
    border-radius: 50%;
  }
  .dot.red{ background: #ff5f56; }
  .dot.yellow{ background: #ffbd2e; }
  .dot.green{ background: #27c93f; }

  .titlebar-label{
    margin-left: 8px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 0.78rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .console-body{
    padding: 34px 32px 30px;
    text-align: center;
  }

  /* ---------- logo, exact language from main site ---------- */
  .logo{
    font-size: 1.9rem;
    font-weight: 600;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Consolas, "Courier New", monospace;
    gap: 6px;
    margin-bottom: 26px;
  }

  .keyword{
    color: var(--keyword);
    animation: fadeKeyword 3s infinite;
    font-size: 1.1rem;
  }

  .classname{
    color: var(--blue-mid);
    overflow: hidden;
    white-space: nowrap;
    width: 0;
    animation: typing 1.4s steps(7,end) 0.3s forwards;
  }

  .brace{
    color: var(--brace);
    font-size: 2rem;
    display: inline-block;
    text-shadow: 0 0 10px rgba(255,215,0,.5);
  }

  .brace.left{ animation: leftBrace 1.6s infinite ease-in-out; }
  .brace.right{ animation: rightBrace 1.6s infinite ease-in-out; }

  .type-cursor{
    width: 3px;
    height: 26px;
    background: var(--cursor);
    display: inline-block;
    animation: blink .8s infinite;
  }

  @keyframes fadeKeyword{ 0%,100%{opacity:1;} 50%{opacity:.65;} }
  @keyframes typing{ from{ width:0; } to{ width:7ch; } }
  @keyframes blink{ 50%{ opacity:0; } }
  @keyframes leftBrace{
    0%,100%{ transform: translateX(0) rotate(0deg); }
    25%{ transform: translateX(-3px) rotate(-10deg); }
    50%{ transform: translateY(-2px) scale(1.15); }
    75%{ transform: translateX(-2px) rotate(-6deg); }
  }
  @keyframes rightBrace{
    0%,100%{ transform: translateX(0) rotate(0deg); }
    25%{ transform: translateX(3px) rotate(10deg); }
    50%{ transform: translateY(-2px) scale(1.15); }
    75%{ transform: translateX(2px) rotate(6deg); }
  }

  /* ---------- terminal-style status feed ---------- */
  .feed{
    text-align: left;
    font-family: Consolas, "Courier New", monospace;
    font-size: 0.86rem;
    min-height: 96px;
    margin-bottom: 22px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .feed-line{
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ink-soft);
    opacity: 0;
    transform: translateX(-8px);
    transition: opacity 0.35s ease, transform 0.35s ease, color 0.3s ease;
  }

  .feed-line.show{
    opacity: 1;
    transform: translateX(0);
  }

  .feed-line .prompt{
    color: var(--blue-mid);
    font-weight: 700;
  }

  .feed-line .status{
    margin-left: auto;
    font-size: 0.75rem;
    color: #c9c9c9;
  }

  .feed-line.done .status{
    color: var(--cursor);
  }

  .feed-line.done .status::before{
    content: '✓ ';
  }

  .feed-line.done{
    color: var(--ink);
  }

  /* ---------- progress bar ---------- */
  .loading-bar{
    position: relative;
    width: 100%;
    height: 8px;
    background: #e9f2fb;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .loading-fill{
    position: absolute;
    inset: 0 auto 0 0;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--blue-deep), var(--blue-bright));
    box-shadow: 0 0 12px rgba(0,123,255,0.55);
    border-radius: 5px;
    transition: width 0.55s cubic-bezier(.4,0,.2,1);
  }

  .loading-fill::after{
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 40px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.65));
    animation: shimmer 1.1s ease-in-out infinite;
  }

  @keyframes shimmer{
    0%,100%{ opacity: 0.4; }
    50%{ opacity: 1; }
  }

  .pct-row{
    display: flex;
    justify-content: space-between;
    font-family: Consolas, "Courier New", monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }

  #pctValue{
    color: var(--blue-mid);
    font-weight: 700;
  }

  /* ---------- exit ---------- */
  .console.fade-out{
    animation: panelOut 0.55s ease forwards;
  }
  @keyframes panelOut{
    to{ opacity: 0; transform: translateY(-14px) scale(0.97); }
  }

  @media (max-width: 480px){
    .console-body{ padding: 26px 20px 24px; }
    .logo{ font-size: 1.55rem; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

  <div class="glow-circle" id="glowCircle"></div>
  <div class="grid-bg"></div>

  <div class="console" id="console">
    <div class="console-titlebar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="titlebar-label">kibriya@portfolio &nbsp;—&nbsp; bash</span>
    </div>

    <div class="console-body">
      <div class="logo">
        <span class="keyword">const</span>
        <span class="classname">Kibriya</span>
        <span class="brace left">{</span>
        <span class="type-cursor"></span>
        <span class="brace right">}</span>
      </div>

      <div class="feed" id="feed">
        <div class="feed-line" data-label="Initializing environment"><span class="prompt">&gt;</span><span class="label">Initializing environment</span><span class="status">pending</span></div>
        <div class="feed-line" data-label="Compiling components"><span class="prompt">&gt;</span><span class="label">Compiling components</span><span class="status">pending</span></div>
        <div class="feed-line" data-label="Fetching projects"><span class="prompt">&gt;</span><span class="label">Fetching projects</span><span class="status">pending</span></div>
        <div class="feed-line" data-label="Rendering portfolio"><span class="prompt">&gt;</span><span class="label">Rendering portfolio</span><span class="status">pending</span></div>
      </div>

      <div class="loading-bar">
        <div class="loading-fill" id="loadingFill"></div>
      </div>
      <div class="pct-row">
        <span>build.sh</span>
        <span><span id="pctValue">0</span>%</span>
      </div>
    </div>
  </div>

<script>
  // ---- cursor glow, same behaviour as main site ----
  const glowCircle = document.getElementById("glowCircle");
  document.addEventListener("mousemove", (e) => {
    glowCircle.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
  });
  document.addEventListener("mouseleave", () => { glowCircle.style.opacity = "0"; });
  document.addEventListener("mouseenter", () => { glowCircle.style.opacity = "1"; });

  // ---- ambient floating code glyphs ----
  const glyphs = ["{ }", "</>", "0101", "npm", "git", "const", "=>", "[ ]", "px", "===", "AI"];
  const particleLayer = document.body;
  for (let i = 0; i < 14; i++) {
    const el = document.createElement("div");
    el.className = "particle";
    el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.fontSize = (0.85 + Math.random() * 0.9) + "rem";
    const duration = 9 + Math.random() * 10;
    el.style.animationDuration = duration + "s";
    el.style.animationDelay = -(Math.random() * duration) + "s";
    particleLayer.appendChild(el);
  }

  // ---- staged boot sequence ----
  const lines = document.querySelectorAll(".feed-line");
  const fill = document.getElementById("loadingFill");
  const pctValue = document.getElementById("pctValue");
  const consoleEl = document.getElementById("console");

  let step = 0;
  const total = lines.length;

  function runStep() {
    if (step > 0) {
      lines[step - 1].classList.add("done");
      lines[step - 1].querySelector(".status").textContent = "done";
    }

    if (step < total) {
      const line = lines[step];
      line.classList.add("show");
      const pct = Math.round(((step + 1) / total) * 100);
      fill.style.width = pct + "%";
      pctValue.textContent = pct;
      step++;
      setTimeout(runStep, 550);
    } else {
      setTimeout(() => {
        // Flag main.html so it continues this exact grid/particle atmosphere
        // instead of cutting to a blank page, then dissolves it smoothly.
        sessionStorage.setItem("fromLoader", "1");
        consoleEl.classList.add("fade-out");
        setTimeout(() => {
          window.location.href = "main.html";
        }, 550);
      }, 350);
    }
  }

  setTimeout(runStep, 400);
</script>
</body>
</html>
